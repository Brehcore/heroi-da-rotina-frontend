<div class="minor-portal-wrapper">
  <!-- 1. Header do Menor -->
  <app-minor-header
    [minorName]="minorName || 'Campeão'"
    [minorProfileUrl]="minorProfileUrl"
    (logoutEvent)="logout()"
  ></app-minor-header>

  <!-- Pull to Refresh Feedback -->
  @if (isRefreshing) {
    <div class="refresh-indicator">
      🔄 Atualizando seus dados...
    </div>
  }

  <!-- Mensagens Globais de WebSocket / Ações -->
  @if (successMsg) {
    <div class="floating-alert success">{{ successMsg }}</div>
  }
  @if (error) {
    <div class="floating-alert error">{{ error }}</div>
  }

  <!-- 2. Corpo do Portal: Sidebar + Área Central Dinâmica -->
  <div class="portal-body">
    <app-minor-sidebar></app-minor-sidebar>

    <!-- Aqui o Angular renderiza a tela conforme a rota clicada -->
    <main class="portal-content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
